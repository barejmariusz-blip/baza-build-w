<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baza Buildów</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Zbrojownia: grafitowy stół, mosiężne akcenty, statusy w kolorach rzadkości łupów */
:root{
  --bg:#0f1012; --bg2:#16181b; --panel:#1b1d21; --panel2:#22252a; --line:#2d3036; --line2:#3a3e45;
  --text:#ece6da; --muted:#9a968d; --dim:#6c6a64;
  --brass:#d9a441; --brass2:#f0c46a;
  --r-fav:#c7a35a; --r-ok:#3fbf5f; --r-test:#6f8cff; --r-old:#7d7b76;
  --danger:#e05a4a;
  --display:"Chakra Petch","Bahnschrift","Segoe UI Semibold",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 var(--body);overflow:hidden;
  background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px),radial-gradient(1000px 520px at 100% -10%,#d9a4411a,transparent 60%);
  background-size:28px 28px,28px 28px,auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:260px 1fr;height:100vh}

/* sidebar */
aside{border-right:1px solid var(--line);background:#121315e6;display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font:700 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand h1 b{color:var(--brass)}
.brand small{display:block;color:var(--dim);font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.games{flex:1;overflow:auto;padding:12px 10px}
.games h3{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:6px 8px 8px;display:flex;justify-content:space-between;align-items:center}
.gitem{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;color:var(--muted)}
.gitem:hover{background:var(--panel)}
.gitem.on{background:var(--panel2);color:var(--text)}
.gitem .sw{width:10px;height:10px;transform:rotate(45deg);flex:none;border-radius:2px}
.gitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem .ct{font:500 12px var(--mono);color:var(--dim)}
.gitem .ed{opacity:0;border:0;background:none;color:var(--dim);cursor:pointer;padding:0 2px;font-size:13px}
.gitem:hover .ed{opacity:1}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:8px;font-size:12px;color:var(--dim)}
.save-state{font:500 11.5px var(--mono);display:flex;gap:6px;align-items:center}
.save-state i{width:7px;height:7px;border-radius:50%;background:var(--r-ok);display:inline-block}
.save-state.err i{background:var(--danger)}
.side-foot .row{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:6px}
.credit{font-size:11px;color:var(--dim);line-height:1.4}
.credit b{color:var(--muted)}

/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{padding:18px 26px 12px;display:grid;gap:12px;border-bottom:1px solid var(--line);background:#0f1012cc;backdrop-filter:blur(6px)}
.searchrow{display:flex;gap:10px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;height:48px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);padding:0 110px 0 46px;font-size:16px}
.search input:focus{border-color:var(--brass);outline:none;box-shadow:0 0 0 3px #d9a44122}
.search svg{position:absolute;left:15px;top:14px;color:var(--dim)}
.search kbd{position:absolute;right:12px;top:13px;font:500 11px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:2px 6px}
.btn{height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#1a1408;font-weight:600}
.btn.pri:hover{background:var(--brass2)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.searchrow .btn.pri{height:48px;padding:0 20px;font-family:var(--display);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:none;cursor:pointer;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chips .sep{width:1px;height:18px;background:var(--line2);margin:0 4px}
.chips select{height:28px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);padding:0 10px;font-size:12.5px;color:var(--muted)}
.web{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.web .lbl{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-right:4px}

.content{flex:1;overflow:auto;padding:20px 26px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{position:relative;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:8px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--line2)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--gc)}
.card .thumb{height:120px;background-size:cover;background-position:center top;border-bottom:1px solid var(--line);filter:saturate(.9)}
.card .body{padding:14px 16px 14px 18px;display:grid;gap:8px}
.card .gname{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gc)}
.card h4{margin:0;font:600 18px/1.2 var(--display);letter-spacing:.01em}
.card .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.card .snip{font-size:12.5px;color:var(--muted);background:#ffffff08;border-radius:4px;padding:6px 8px;border-left:2px solid var(--brass)}
.card .snip em{font-style:normal;color:var(--brass2)}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.card .src{display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .src img{width:14px;height:14px;border-radius:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:4px;background:#ffffff0d;color:var(--muted);border:1px solid #ffffff10}
.rar{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.rar.fav{color:var(--r-fav)} .rar.ok{color:var(--r-ok)} .rar.test{color:var(--r-test)} .rar.old{color:var(--r-old)}
.card .rar{position:absolute;top:12px;right:12px;background:#0f1012cc}
.card.has-thumb .rar{top:10px}
.stars{color:var(--brass);letter-spacing:1px;font-size:12px}
.empty{max-width:560px;margin:70px auto;text-align:center;color:var(--muted)}
.empty h2{font:600 26px var(--display);color:var(--text);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.empty p{margin:0 0 18px}
.counter{font:500 12px var(--mono);color:var(--dim);margin-bottom:12px;letter-spacing:.06em}

/* modal */
.ov{position:fixed;inset:0;background:#000000b3;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto;z-index:20;backdrop-filter:blur(3px)}
.modal{width:min(980px,100%);background:var(--bg2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 30px 80px #000a;position:relative}
.modal.small{width:min(520px,100%)}
.mh{padding:22px 26px 18px;border-bottom:1px solid var(--line);display:grid;gap:8px;position:relative}
.mh::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--gc,var(--brass));border-radius:10px 0 0 0}
.mh .gname{font:600 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gc,var(--brass))}
.mh h2{margin:0;font:700 28px/1.15 var(--display);letter-spacing:.01em;padding-right:120px}
.mh .meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.mh .acts{position:absolute;top:18px;right:18px;display:flex;gap:6px}
.mb{padding:22px 26px 26px;display:grid;gap:22px}
.blk h5{margin:0 0 10px;font:600 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:10px}
.blk h5::after{content:"";flex:1;height:1px;background:var(--line)}
.links{display:grid;gap:6px}
.link{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;text-align:left;width:100%}
.link:hover{border-color:var(--brass)}
.link img{width:16px;height:16px}
.link .t{flex:1;min-width:0}
.link .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link .t span{display:block;font:500 11.5px var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.sec{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:12px 14px}
.sec h6{margin:0 0 6px;font:600 14px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--brass2)}
.sec pre,.notes{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;color:var(--text)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.gallery .im{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000;aspect-ratio:16/10;cursor:zoom-in}
.gallery .im img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .im button{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:4px;border:0;background:#000c;color:#fff;cursor:pointer}
.lightbox{position:fixed;inset:0;background:#000e;z-index:40;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.lightbox img{max-width:100%;max-height:100%;box-shadow:0 20px 60px #000}
.hl mark{background:#d9a44140;color:inherit;border-radius:2px}
.stamp{font:500 11.5px var(--mono);color:var(--dim)}

/* form */
.form{display:grid;gap:16px}
.frow{display:grid;grid-template-columns:repeat(var(--c,2),1fr);gap:12px}
label.f{display:grid;gap:5px;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.f input,.f select,.f textarea,.inp{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:9px 11px;font:14px var(--body);color:var(--text);text-transform:none;letter-spacing:0}
.f textarea,.inp.ta{min-height:90px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--brass);outline:none}
.statpick{display:flex;gap:6px;flex-wrap:wrap}
.statpick button{background:none;cursor:pointer;opacity:.45}
.statpick button.on{opacity:1;background:#ffffff0d}
.starpick button{background:none;border:0;cursor:pointer;color:var(--line2);font:22px/1 var(--body)!important;padding:0 1px}
.starpick button.on{color:var(--brass)}
.srcrow,.secrow{display:grid;gap:8px;grid-template-columns:1.4fr 1fr auto;align-items:start}
.secrow{grid-template-columns:1fr auto;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel)}
.secrow .inner{display:grid;gap:6px}
.secrow .inner input{font:600 13px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--brass2)}
.list{display:grid;gap:8px}
.x{width:32px;height:38px;border:1px solid var(--line2);background:none;border-radius:6px;cursor:pointer;color:var(--dim)}
.x:hover{color:var(--danger);border-color:var(--danger)}
.drop{border:1.5px dashed var(--line2);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--brass);background:#d9a44110}
.hint{font-size:12px;color:var(--dim)}
.mf{padding:16px 26px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:center;position:sticky;bottom:0;background:var(--bg2);border-radius:0 0 10px 10px}
.mf .r{display:flex;gap:8px}
.tagin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:6px 8px;min-height:40px}
.tagin input{border:0;background:none;flex:1;min-width:120px;padding:3px;outline:none;font:14px var(--body);color:var(--text);text-transform:none;letter-spacing:0}
.tagin .tag{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tagin .tag:hover{border-color:var(--danger)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;z-index:60;box-shadow:0 10px 30px #0008}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:26px;height:26px;border-radius:5px;border:2px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--text)}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{display:none}.frow{grid-template-columns:1fr}.srcrow{grid-template-columns:1fr}}
</style></head><body>
<div class="app">
  <aside>
    <div class="brand"><h1>Baza <b>Buildów</b></h1><small>Zbrojownia buildów</small></div>
    <div class="games" id="games"></div>
    <div class="side-foot">
      <div class="save-state" id="saveState"><i></i><span>Wczytywanie…</span></div>
      <div class="row">
        <button class="btn sm" id="bFolder" title="Wybierz, gdzie zapisywać dane">Folder danych</button>
        <button class="btn sm ghost" id="bOpen" title="Otwórz folder w Eksploratorze">Otwórz</button>
        <button class="btn sm ghost" id="bBackup" title="Zrób kopię teraz">Kopia</button>
      </div>
      <div class="row">
        <button class="btn sm ghost" id="bExport">Eksport</button>
        <button class="btn sm ghost" id="bImport">Import</button>
        <input type="file" id="fImport" accept=".json,application/json" class="hidden">
      </div>
      <div class="credit">Made by <b>PanRodla</b> · © <span id="yr"></span> Wszelkie prawa zastrzeżone.<br>Linki i treści buildów należą do ich autorów.</div>
    </div>
  </aside>
  <main>
    <div class="top">
      <div class="searchrow">
        <div class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" placeholder="Szukaj: nazwa, klasa, skill, przedmiot, tag, strona…" autocomplete="off" spellcheck="false">
          <kbd>Ctrl+K</kbd>
        </div>
        <button class="btn pri" id="bNew">+ Build</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="web hidden" id="web"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="modalRoot"></div>
<script>
const STATUS={fav:{l:"Ulubiony",c:"var(--r-fav)"},ok:{l:"Sprawdzony",c:"var(--r-ok)"},test:{l:"Do testu",c:"var(--r-test)"},old:{l:"Archiwum",c:"var(--r-old)"}};
const PALETTE=["#c8452f","#e8a33d","#f2e94e","#7cc95b","#4fb3a9","#5b8def","#9b6cf0","#e46fb0","#b0aba0"];
const SEC_PRESETS=["Umiejętności","Ekwipunek","Statystyki","Rotacja / gameplay","Kolejność levelowania","Najemnik / towarzysz","Uwagi"];
let S={games:[],builds:[],dir:"",isDefault:true};
let F={game:"",status:"",tag:"",sort:"updated",q:""};
let saveTimer=null,dirty=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ł/g,"l");
const uid=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch{return ""}};
const fav=u=>{const h=host(u);return h?`<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=32" alt="" onerror="this.remove()">`:""};
const gameOf=id=>S.games.find(g=>g.id===id)||{name:"Bez gry",color:"#888",id:""};
const fmtDate=t=>t?new Date(t).toLocaleDateString("pl-PL",{day:"numeric",month:"short",year:"numeric"}):"";
const stars=n=>n?`<span class="stars">${"★".repeat(n)}<span style="color:var(--line2)">${"★".repeat(5-n)}</span></span>`:"";
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function setSave(t,err){const e=$("#saveState");e.classList.toggle("err",!!err);e.querySelector("span").textContent=t}

async function api(path,opt){const r=await fetch(path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j}
async function load(){
  try{const d=await api("/api/data");S.games=d.games||[];S.builds=d.builds||[];S.dir=d.dir;S.isDefault=d.isDefault;setSave("Zapis: "+shortDir(d.dir))}
  catch(e){setSave("Błąd odczytu: "+e.message,true)}
  render();
}
const shortDir=d=>!d?"":d.length>34?"…"+d.slice(-33):d;
function save(){dirty=true;setSave("Zapisywanie…");clearTimeout(saveTimer);saveTimer=setTimeout(flush,350)}
async function flush(){
  try{const r=await api("/api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({games:S.games,builds:S.builds})});dirty=false;setSave("Zapisano "+r.savedAt)}
  catch(e){setSave("Nie zapisano! "+e.message,true)}
}
window.addEventListener("beforeunload",()=>{if(dirty)navigator.sendBeacon?.("/api/data",new Blob([JSON.stringify({games:S.games,builds:S.builds})],{type:"application/json"}))});

/* ---------- search ---------- */
function haystack(b){
  const g=gameOf(b.gameId);
  return [
    [b.name,5,"Nazwa"],[(b.tags||[]).join(" "),4,"Tagi"],[b.cls,3,"Klasa"],[b.patch,2,"Patch"],[g.name,2,"Gra"],
    ...(b.sections||[]).map(s=>[s.title+": "+s.body,1,s.title||"Sekcja"]),[b.notes,1,"Notatki"],
    ...(b.sources||[]).map(s=>[(s.label||"")+" "+s.url,1,"Źródło"])
  ];
}
function match(b,toks){
  if(!toks.length)return {score:1};
  let score=0,snip=null;
  const hs=haystack(b).map(([t,w,l])=>[t||"",norm(t),w,l]);
  for(const tk of toks){
    let best=0,where=null;
    for(const h of hs){if(h[1].includes(tk)){if(h[2]>best){best=h[2];where=h}}}
    if(!best)return null;
    score+=best;
    if(best<=1&&!snip&&where)snip=[where,tk];
  }
  return {score,snip};
}
function snippet([h,tk]){
  const [raw,n,,lbl]=h;const i=n.indexOf(tk);
  const a=Math.max(0,i-40),z=Math.min(raw.length,i+tk.length+60);
  return `<b>${esc(lbl)}:</b> ${a?"…":""}${esc(raw.slice(a,i))}<em>${esc(raw.slice(i,i+tk.length))}</em>${esc(raw.slice(i+tk.length,z))}${z<raw.length?"…":""}`;
}
function filtered(){
  const toks=norm(F.q).split(/\s+/).filter(Boolean);
  const out=[];
  for(const b of S.builds){
    if(F.game&&b.gameId!==F.game)continue;
    if(F.status&&b.status!==F.status)continue;
    if(F.tag&&!(b.tags||[]).includes(F.tag))continue;
    const m=match(b,toks);if(!m)continue;
    out.push({b,...m});
  }
  const by={updated:(x,y)=>(y.b.updated||0)-(x.b.updated||0),opened:(x,y)=>(y.b.opened||0)-(x.b.opened||0),name:(x,y)=>x.b.name.localeCompare(y.b.name,"pl"),rating:(x,y)=>(y.b.rating||0)-(x.b.rating||0)};
  out.sort((x,y)=>toks.length&&y.score!==x.score?y.score-x.score:by[F.sort](x,y));
  return out;
}

/* ---------- detail ---------- */
function hl(text){
  const toks=norm(F.q).split(/\s+/).filter(t=>t.length>1);let h=esc(text);
  if(!toks.length)return h;
  // highlight on the escaped text using normalized positions (diacritics-safe for 1:1 chars)
  const n=norm(h);let out="",i=0;
  const re=new RegExp(toks.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");let m;
  while((m=re.exec(n))){if(m[0].length===0)break;out+=h.slice(i,m.index)+"<mark>"+h.slice(m.index,m.index+m[0].length)+"</mark>";i=m.index+m[0].length}
  return out+h.slice(i);
}

async function addImages(files){
  files=files.filter(f=>f.type.startsWith("image/"));if(!files.length)return;
  syncEditor();
  for(const f of files){
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
    try{const j=await api("/api/image",{method:"POST",body:data});E.b.images.push(j.name)}catch(e){toast("Nie zapisano obrazu: "+e.message)}
  }
  drawEditor();toast("Dodano screen");
}
function syncEditor(){
  if(!E)return;const b=E.b,root=$("#modalRoot");
  root.querySelectorAll("[data-k]").forEach(el=>{if(el.dataset.k!=="gameId"||el.value!=="__new")b[el.dataset.k]=el.value});
  root.querySelectorAll("[data-src]").forEach(el=>b.sources[+el.dataset.src][el.dataset.f]=el.value);
  root.querySelectorAll("[data-sec]").forEach(el=>b.sections[+el.dataset.sec][el.dataset.f]=el.value);
  const ti=$("#tagInput");if(ti&&ti.value.trim()){addTag(ti.value);ti.value=""}
}
function addTag(v){for(const t of v.split(",").map(x=>x.trim().replace(/^#/,"")).filter(Boolean))if(!E.b.tags.includes(t))E.b.tags.push(t)}
function commitEditor(){
  syncEditor();const b=E.b;
  if(!b.name.trim()){const src=b.sources.find(s=>s.url);b.name=src?(src.label||host(src.url)):"";}
  if(!b.name.trim()){toast("Podaj nazwę buildu");$("[data-k=name]")?.focus();return}
  b.sources=b.sources.filter(s=>s.url.trim()).map(s=>({url:s.url.trim(),label:s.label.trim()}));
  b.sections=b.sections.filter(s=>s.body.trim());
  b.updated=Date.now();if(!b.created)b.created=b.updated;
  const i=S.builds.findIndex(x=>x.id===b.id);
  if(i>=0)S.builds[i]=b;else S.builds.unshift(b);
  const wasNew=E.isNew;E=null;
  save();closeModal();render();toast(wasNew?"Build zapisany":"Zmiany zapisane");
}
async function fillTitle(i){
  const s=E.b.sources[i];if(!s||!/^https?:\/\//.test(s.url))return;
  try{const j=await api("/api/title?u="+encodeURIComponent(s.url));
    if(!E)return;
    if(j.title){if(!s.label)s.label=host(s.url);if(!E.b.name)E.b.name=j.title.slice(0,90);if(!E.b.notes.includes(j.title)&&j.title!==E.b.name)E.b.notes=(E.b.notes?E.b.notes+"\n":"")+"Tytuł strony: "+j.title}
    else if(!s.label)s.label=host(s.url);
    autoGame(s.url);drawEditor();
  }catch{}
}
function autoGame(url){
  const h=host(url),p=norm(url);if(!h)return;
  const g=S.games.find(g=>(g.sites||"").split(",").map(x=>x.trim()).filter(Boolean).some(s=>h.endsWith(s.split("/")[0])&&p.includes(norm(s)))||p.includes(norm(g.name).replace(/[^a-z0-9]+/g,"-")));
  if(g&&E.isNew)E.b.gameId=g.id;
}

/* ---------- games ---------- */

  const back=fromEditor?E:null;
  modal(`<div class="modal small"><div class="mh" style="--gc:${g.color}"><div class="gname">${id?"Edycja gry":"Nowa gra"}</div><h2>${esc(g.name)||"Gra"}</h2><div class="acts"><button class="btn sm ghost" data-close>✕</button></div></div>

  let col=g.color;

  };
  if(back)document.querySelectorAll("#modalRoot [data-close]").forEach(b=>b.removeAttribute("data-close")||(b.onclick=()=>{E=back;drawEditor()}));

/* ---------- modal plumbing ---------- */
function modal(html,isEditor){
  $("#modalRoot").innerHTML=`<div class="ov">${html}</div>`;
  const ov=$("#modalRoot .ov");
  ov.addEventListener("mousedown",e=>{if(e.target===ov)ov._down=true});
  ov.addEventListener("click",e=>{if(e.target===ov&&ov._down&&!isEditor)closeModal();ov._down=false});
}
function closeModal(){$("#modalRoot").innerHTML="";if(E&&!$("#modalRoot .ov"))E=null}
function confirmBox(text,yes){
  const d=document.createElement("div");d.className="ov";d.style.zIndex=50;
  d.innerHTML=`<div class="modal small"><div class="mb"><div style="font-size:16px">${esc(text)}</div></div><div class="mf"><span></span><div class="r"><button class="btn" id="cNo">Nie</button><button class="btn pri" id="cYes" style="background:var(--danger);border-color:var(--danger);color:#fff">Tak, usuń</button></div></div></div>`;
  document.body.appendChild(d);d.querySelector("#cNo").onclick=()=>d.remove();d.querySelector("#cYes").onclick=()=>{d.remove();yes()};
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-id],[data-zoom],.tag[data-deltag],.ed");if(!t)return;
  const d=t.dataset;
  if(d.edg!==undefined){e.stopPropagation();editGame(d.edg);return}
  if(d.g!==undefined){F.game=d.g;F.tag="";render();return}
  if(t.id==="bAddGame"){editGame(null);return}
  if(d.st){F.status=F.status===d.st?"":d.st;render();return}
  if(d.tag!==undefined&&t.classList.contains("chip")){F.tag=F.tag===d.tag?"":d.tag;render();return}
  if(d.url){fetch("/api/open-url?u="+encodeURIComponent(d.url));return}
  if(d.id&&t.classList.contains("card")){openDetail(d.id);return}
  if(d.zoom!==undefined&&!e.target.closest("[data-delimg]")){const lb=document.createElement("div");lb.className="lightbox";lb.innerHTML=`<img src="/img/${encodeURIComponent(d.zoom)}">`;lb.onclick=()=>lb.remove();document.body.appendChild(lb);return}
  if(d.close!==undefined){closeModal();return}
  if(d.new){openEditor(newBuild({name:F.q.trim()}),true);return}
  if(d.edit){openEditor(S.builds.find(b=>b.id===d.edit),false);return}
  if(!E)return;
  /* editor actions */
  if(d.star){syncEditor();E.b.rating=E.b.rating==+d.star?0:+d.star;drawEditor();return}
  if(d.stp){syncEditor();E.b.status=d.stp;drawEditor();return}
  if(d.deltag!==undefined){syncEditor();E.b.tags.splice(+d.deltag,1);drawEditor();return}
  if(d.addsrc!==undefined){syncEditor();E.b.sources.push({url:"",label:""});drawEditor();document.querySelectorAll("[data-src][data-f=url]").forEach((x,i,a)=>i===a.length-1&&x.focus());return}
  if(d.delsrc!==undefined){syncEditor();E.b.sources.splice(+d.delsrc,1);if(!E.b.sources.length)E.b.sources.push({url:"",label:""});drawEditor();return}
  if(d.addsec!==undefined){syncEditor();E.b.sections.push({title:d.addsec,body:""});drawEditor();const ts=document.querySelectorAll("textarea[data-sec]");ts[ts.length-1]?.focus();return}
  if(d.delsec!==undefined){syncEditor();E.b.sections.splice(+d.delsec,1);drawEditor();return}
  if(d.delimg!==undefined){e.stopPropagation();syncEditor();E.b.images.splice(+d.delimg,1);drawEditor();return}
  if(t.id==="pickImg"){$("#fImg").click();return}
  if(d.savebuild!==undefined){commitEditor();return}
  if(d.dup!==undefined){syncEditor();const c=JSON.parse(JSON.stringify(E.b));c.id=uid("b");c.name+=" (kopia)";c.created=c.updated=0;openEditor(c,true);return}
  if(d.del!==undefined){const id=E.b.id;confirmBox("Usunąć ten build na zawsze?",()=>{S.builds=S.builds.filter(b=>b.id!==id);save();E=null;closeModal();render();toast("Usunięto")});return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="sort"){F.sort=t.value;renderList();return}
  if(E&&t.dataset.k==="gameId"){if(t.value==="__new"){syncEditor();editGame(null,true)}else{syncEditor();drawEditor()}return}
  if(E&&t.dataset.src!==undefined&&t.dataset.f==="url"){syncEditor();fillTitle(+t.dataset.src)}
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="tagInput"&&(e.key==="Enter"||e.key===",")){e.preventDefault();const v=e.target.value;if(v.trim()){syncEditor();drawEditor();$("#tagInput").focus()}return}
  if(e.target.id==="tagInput"&&e.key==="Backspace"&&!e.target.value&&E.b.tags.length){syncEditor();E.b.tags.pop();drawEditor();$("#tagInput").focus();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(!$("#modalRoot .ov")){$("#q").focus();$("#q").select()}return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&E){e.preventDefault();commitEditor();return}
  if(e.key==="Escape"){const lb=document.querySelector(".lightbox");if(lb){lb.remove();return}if($("#modalRoot .ov")){if(E)return;closeModal()}else if(F.q){$("#q").value="";F.q="";render()}return}
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$("#modalRoot .ov")){e.preventDefault();$("#q").focus()}
  if(e.key==="Enter"&&e.target.id==="q"){const first=document.querySelector(".card");if(first)openDetail(first.dataset.id)}
});
document.addEventListener("paste",e=>{
  const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith("image/"));
  if(E&&files.length&&!/^(INPUT)$/.test(document.activeElement.tagName)){e.preventDefault();addImages(files);return}
  const txt=(e.clipboardData?.getData("text")||"").trim();
  const ae=document.activeElement,editing=/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.id!=="q";
  if(!E&&!editing&&!$("#modalRoot .ov")&&/^https?:\/\/\S+$/.test(txt)){
    e.preventDefault();
    const dup=S.builds.find(b=>(b.sources||[]).some(s=>s.url===txt));
    if(ae.id==="q"){ae.value="";F.q="";renderWeb();renderList();ae.blur()}
    if(dup){toast("Ten link już masz: "+dup.name);openDetail(dup.id);return}
    openEditor(newBuild({sources:[{url:txt,label:""}]}),true);autoGame(txt);drawEditor();fillTitle(0);
  }
});
let qT;$("#q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{F.q=e.target.value;renderWeb();renderList()},90)});
$("#bNew").onclick=()=>openEditor(newBuild({name:F.q.trim()}),true);
$("#bOpen").onclick=()=>fetch("/api/open-folder");
$("#bBackup").onclick=async()=>{try{const j=await api("/api/backup");toast("Kopia: "+j.file)}catch(e){toast("Błąd kopii: "+e.message)}};
$("#bExport").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"Baza Buildów",version:1,games:S.games,builds:S.builds},null,2)],{type:"application/json"}));a.download="baza-buildow-"+new Date().toISOString().slice(0,10)+".json";a.click()};
$("#bImport").onclick=()=>$("#fImport").click();
$("#fImport").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;e.target.value="";
  try{const j=JSON.parse(await f.text());let ng=0,nb=0;
    for(const g of j.games||[])if(!S.games.some(x=>x.id===g.id)){S.games.push(g);ng++}
    for(const b of j.builds||[])if(!S.builds.some(x=>x.id===b.id)){S.builds.push(b);nb++}
    save();render();toast(`Zaimportowano: ${nb} buildów, ${ng} gier`)}catch(err){toast("To nie jest plik Bazy Buildów")}
};
$("#bFolder").onclick=async()=>{
  const p=await api("/api/pick-folder");if(p.cancelled||p.same)return;
  const go=async mode=>{try{await api("/api/set-folder",{method:"POST",body:JSON.stringify({Path:p.path,Mode:mode})});closeModal();await load();toast("Folder danych: "+p.path)}catch(e){toast("Błąd: "+e.message)}};
  modal(`<div class="modal small"><div class="mh"><div class="gname">Folder danych</div><h2 style="font-size:20px;padding-right:40px;word-break:break-all">${esc(p.path)}</h2></div>
   <div class="mb"><div>${p.hasLibrary?"W tym folderze jest już baza buildów. Co zrobić?":"Przeniosę tam obecną bazę, screeny i kopie (stare pliki zostają na miejscu)."}</div></div>
   <div class="mf"><button class="btn" data-close>Anuluj</button><div class="r">${p.hasLibrary?`<button class="btn" id="fUse">Wczytaj tamtą bazę</button><button class="btn pri" id="fCopy">Nadpisz moją obecną</button>`:`<button class="btn pri" id="fCopy">Przenieś</button>`}</div></div></div>`);
  $("#fCopy").onclick=()=>go("copy");if(p.hasLibrary)$("#fUse").onclick=()=>go("use");
};
$("#yr").textContent=new Date().getFullYear();
load();
</script></body></html>
